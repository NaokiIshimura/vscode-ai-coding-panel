name: Test

defaults:
  run:
    shell: bash

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      # Cache the VS Code build downloaded by @vscode/test-electron.
      # A dropped download on Windows is not retried (the process exits), so avoid downloading on every run.
      # The key rotates weekly so that a new stable release is saved to the cache.
      - name: Get cache week
        id: cache-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache VS Code for tests
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ steps.cache-week.outputs.week }}
          restore-keys: |
            vscode-test-${{ runner.os }}-

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Run tests (macOS/Windows)
        if: runner.os != 'Linux'
        run: npm test

      # Keep only the newest VS Code build so that the cache does not grow with every release
      - name: Prune old VS Code builds
        if: always()
        run: |
          if [ -d .vscode-test ]; then
            ls -dt .vscode-test/vscode-* 2>/dev/null | tail -n +2 | xargs -r rm -rf
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.node-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/
            *.log
          retention-days: 7
          if-no-files-found: ignore
