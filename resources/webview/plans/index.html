<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}}; script-src {{cspSource}}; font-src {{cspSource}};">
    <title>Plans</title>
    <link rel="stylesheet" href="{{codiconsUri}}">
    <link rel="stylesheet" href="{{styleUri}}">
</head>
<body>
    <div id="header">
        <div class="search-box">
            <span class="codicon codicon-search search-icon"></span>
            <input type="text" id="search-input" placeholder="Search plans" aria-label="Search plans" spellcheck="false" autocomplete="off">
            <button class="search-clear hidden" id="search-clear" title="Clear search" aria-label="Clear search">
                <span class="codicon codicon-close"></span>
            </button>
        </div>
        <div class="header-actions">
            <button class="quick-start-button" id="quick-start-button" title="Create a new task directory instantly">
                <span class="codicon codicon-zap"></span>
                <span>Quick Start</span>
            </button>
        </div>
    </div>
    <div id="list" tabindex="0"></div>
    <div id="footer">
        <span class="footer-hint" title="VS Code disables drops into this view unless Shift is held while dragging">
            <span class="codicon codicon-info"></span>
            <span>Hold Shift to drop files here</span>
        </span>
        <button class="resume-session-button" id="resume-session-button" title="Resume the latest Claude Code session recorded in metadata.md of this directory">
            <span class="codicon codicon-debug-restart"></span>
            <span>Resume Session</span>
        </button>
    </div>
    <div id="context-menu" class="context-menu hidden"></div>
    <div id="tooltip" class="tooltip hidden" role="tooltip"></div>
    <script src="{{scriptUri}}"></script>
</body>
</html>
